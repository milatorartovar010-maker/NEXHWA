<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEXHWA</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #07090d;
            color: white;
            font-family: Arial, sans-serif;
        }

        /* Header */

        header {
            height: 70px;
            background: #0d1118;
            border-bottom: 1px solid #182538;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 20px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 2px;
            color: white;
        }

        .logo span {
            color: #1683ff;
        }

        nav {
            display: flex;
            gap: 18px;
        }

        nav a {
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
        }

        nav a:hover {
            color: #1683ff;
        }

        /* Hero */

        .hero {
            padding: 60px 20px 35px;
            text-align: center;

            background:
                radial-gradient(circle at top,
                #10294a 0%,
                #07090d 55%);
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .hero h1 span {
            color: #1683ff;
        }

        .hero p {
            color: #999;
            font-size: 15px;
            margin-bottom: 25px;
        }

        /* Search */

        .search {
            max-width: 500px;
            margin: auto;
        }

        .search input {
            width: 100%;
            padding: 16px 20px;

            border-radius: 12px;
            border: 1px solid #1b3554;

            background: #10151d;
            color: white;

            outline: none;
            font-size: 15px;
        }

        .search input:focus {
            border-color: #1683ff;
            box-shadow: 0 0 12px #1683ff33;
        }

        /* Sections */

        .section {
            padding: 25px 20px;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 18px;
        }

        .section-title h2 {
            font-size: 22px;
        }

        .section-title span {
            color: #1683ff;
            font-size: 13px;
        }

        /* Card */

        .card {
            background: #0d1118;
            border: 1px solid #182538;

            border-radius: 14px;
            padding: 18px;

            margin-bottom: 15px;

            transition: 0.2s;
        }

        .card:hover {
            border-color: #1683ff;
            transform: translateY(-2px);
        }

        .card h3 {
            margin-bottom: 8px;
            font-size: 18px;
        }

        .card p {
            color: #888;
            font-size: 13px;
        }

        .badge {
            display: inline-block;

            margin-top: 12px;

            padding: 5px 10px;

            border-radius: 7px;

            background: #1683ff;
            color: white;

            font-size: 11px;
        }

        /* Bottom navigation */

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;

            height: 65px;

            background: #0b0f15;
            border-top: 1px solid #182538;

            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .bottom-nav a {
            color: #777;
            text-decoration: none;
            font-size: 12px;
            text-align: center;
        }

        .bottom-nav a.active {
            color: #1683ff;
        }

        .icon {
            font-size: 20px;
            display: block;
            margin-bottom: 3px;
        }

    </style>
</head>


<body>

    <!-- Header -->

    <header>

        <div class="logo">
            NEX<span>HWA</span>
        </div>

        <nav>
            <a href="#">خانه</a>
            <a href="#">مانهوا</a>
            <a href="#">جدیدترین</a>
        </nav>

    </header>


    <!-- Hero -->

    <section class="hero">

        <h1>
            به <span>NEXHWA</span> خوش آمدید
        </h1>

        <p>
            دنیای مانهوا در یکجا
        </p>


        <div class="search">

            <input
                type="text"
                placeholder="جستجوی مانهوا..."
            >

        </div>

    </section>


    <!-- Latest -->

    <section class="section">

        <div class="section-title">

            <h2>
                جدیدترین مانهواها
            </h2>

            <span>
                مشاهده همه
            </span>

        </div>


        <div class="card">

            <h3>
                اولین مانهوا
            </h3>

            <p>
                به‌زودی مانهواهای جدید در این قسمت قرار می‌گیرند.
            </p>

            <span class="badge">
                جدید
            </span>

        </div>


        <div class="card">

            <h3>
                Coming Soon
            </h3>

            <p>
                فصل‌های جدید به‌زودی اضافه می‌شوند.
            </p>

        </div>

    </section>


    <!-- Bottom Navigation -->

    <div class="bottom-nav">

        <a href="#" class="active">
            <span class="icon">⌂</span>
            خانه
        </a>

        <a href="#">
            <span class="icon">▣</span>
            مانهوا
        </a>

        <a href="#">
            <span class="icon">★</span>
            محبوب‌ها
        </a>

        <a href="#">
            <span class="icon">⚙</span>
            تنظیمات
        </a>

    </div>


</body>

</html>
